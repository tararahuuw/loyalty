# ================================ PRODUCTION ================================

# ---------------
# Container Service
# ---------------
deploy_container_prod:
  stage: deploy
  tags:
    - container-prod
  image: ubuntu:latest
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - container/**/*
  before_script:
    - apt-get -yq update
    - apt-get -yqq install ssh
    - install -m 600 -D /dev/null ~/.ssh/id_rsa
    - echo "$SSH_PRIVATE_KEY_PROD" | base64 -d > ~/.ssh/id_rsa
    - ssh-keyscan -H $SSH_HOST_PROD > ~/.ssh/known_hosts
  script:
    - echo "Deploying Container Service..."
    - ssh $SSH_USER@$SSH_HOST_PROD "cd $WORK_DIR && git checkout $PROD_BRANCH && git pull && cd container && docker compose down -v && docker compose up --build -d frontend-container"
  after_script:
    - rm -rf ~/.ssh

