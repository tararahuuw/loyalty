server {
    listen 80;

    # Serve the React app
    root /usr/share/nginx/html;
    index index.html;

    # Serve your app and allow CORS
    location / {
        try_files $uri $uri/ /index.html;

        # Disable Nginx caching
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
        add_header Pragma "no-cache";
        add_header Expires 0;

        # CORS and security headers
        add_header 'Access-Control-Allow-Origin' '*';
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
        add_header 'Access-Control-Allow-Headers' 'Origin, Authorization, Accept, Content-Type, X-Requested-With';
        add_header 'Access-Control-Allow-Credentials' 'true';

        add_header X-Frame-Options "DENY";
        add_header X-Content-Type-Options "nosniff";
        add_header X-XSS-Protection "1; mode=block";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # Content Security Policy
        add_header Content-Security-Policy "default-src 'self'; 
                                    script-src 'self' 'unsafe-inline' http://192.168.4.221:3000 http://192.168.4.221:3001 http://192.168.4.221:3002 http://192.168.4.221:3003 http://192.168.4.221:3004 http://192.168.4.221:3008 http://192.168.4.224:8080 http://192.168.4.224:8083 https://staging-prezent.sandeza.id; 
                                    connect-src 'self' http://192.168.4.221:3000 http://192.168.4.221:3001 http://192.168.4.221:3002 http://192.168.4.221:3003 http://192.168.4.221:3004 http://192.168.4.221:3008 http://192.168.4.224:8080 http://192.168.4.224:8083 https://staging-prezent.sandeza.id; 
                                    object-src 'none'; 
                                    img-src 'self' data: blob:; 
                                    frame-src 'self'; 
                                    style-src 'self' 'unsafe-inline';";
        add_header Referrer-Policy "no-referrer";

        # Handle OPTIONS requests (preflight requests for CORS)
        if ($request_method = OPTIONS) {
            return 204;
        }
    }
}
