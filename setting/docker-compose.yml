version: "3.8"

services:
  frontend-setting:
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile.react
    ports:
      - "3008:3008"
    networks:
      - frontend_bridge

  frontend-staging:
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile.react.staging
    ports:
      - "3008:3008"
    networks:
      - frontend_bridge

  frontend-development:
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile.react.development
    ports:
      - "3008:3008"
    networks:
      - frontend_bridge
      
networks:
  frontend_bridge:
    external: true
