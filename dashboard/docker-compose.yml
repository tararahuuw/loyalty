version: "3.8"

services:
  frontend-dashboard:
    build:
      context: .
      dockerfile: Dockerfile.react.staging
    volumes:
      - dist:/usr/src/app/dist
    networks:
      - frontend_bridge

  dashboard-nginx:
    build:
      context: .
      dockerfile: Dockerfile.nginx
    ports:
      - "3009:80"
    depends_on:
      - frontend-dashboard
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - dist:/usr/share/nginx/html
    entrypoint: sh -c 'while [ ! -d /usr/share/nginx/html ]; do sleep 1; done && nginx -g "daemon off;"'
    networks:
      - frontend_bridge

  frontend-development:
    build:
      context: .
      dockerfile: Dockerfile.react.development
    volumes:
      - dist:/usr/src/app/dist
    networks:
      - frontend_bridge

  nginx-development:
    build:
      context: .
      dockerfile: Dockerfile.nginx
    ports:
      - "3009:80"
    depends_on:
      - frontend-development
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - dist:/usr/share/nginx/html
    entrypoint: sh -c 'while [ ! -d /usr/share/nginx/html ]; do sleep 1; done && nginx -g "daemon off;"'
    networks:
      - frontend_bridge

volumes:
  dist:

networks:
  frontend_bridge:
    external: true
