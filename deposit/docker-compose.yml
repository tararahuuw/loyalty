version: "3.8"

services:
  frontend-deposit:
    build:
      context: .
      dockerfile: Dockerfile.react
    volumes:
      - dist:/usr/src/app/dist
    networks:
      - frontend_bridge

  frontend-development:
    build:
      context: .
      dockerfile: Dockerfile.react.development
    ports:
      - "3010:3010"
    networks:
      - frontend_bridge

  deposit-nginx:
    build:
      context: .
      dockerfile: Dockerfile.nginx
    ports:
      - "3010:80"
    depends_on:
      - frontend-deposit
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - dist:/usr/share/nginx/html
    entrypoint: sh -c 'while [ ! -d /usr/share/nginx/html ]; do sleep 1; done && nginx -g "daemon off;"'
    networks:
      - frontend_bridge

volumes:
  dist:

networks:
  frontend_bridge:
    external: true
